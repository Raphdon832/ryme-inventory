<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Ryme Icon 2.png" />
    <link rel="apple-touch-icon" href="/Ryme Icon 2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RymeInv" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Inventory Management System for Ryme Interiors" />
    <title>Ryme Interiors</title>
    <script>
      (function() {
        try {
          var s = localStorage.getItem('ryme_settings');
          if (s) {
            var p = JSON.parse(s);
            var m = p && p.display && p.display.darkMode;
            if (m) {
              var d = (m === 'dark' || m === true) || (m === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
              var el = document.documentElement || document.body;
              if (d && el && el.classList) {
                el.classList.add('theme-dark');
              }
            }
          }
        } catch (e) {
          console.warn('Theme init error', e);
        }
      })();
    </script>
    <style>
      /* Pre-loader Splash Styles */
      .splash-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        isolation: isolate;
        background: linear-gradient(135deg, rgba(239, 246, 255, 0.9), rgba(248, 250, 252, 0.8)), #edf5ff;
        display: flex; align-items: center; justify-content: center;
        z-index: 9999;
        transition: opacity 0.8s ease, transform 0.8s ease;
      }
      .splash-overlay::before {
        content: '';
        position: absolute;
        inset: -28%;
        z-index: -2;
        background:
          radial-gradient(ellipse at 18% 28%, rgba(37, 99, 235, 0.66) 0%, rgba(59, 130, 246, 0.42) 24%, transparent 52%),
          radial-gradient(ellipse at 78% 70%, rgba(2, 6, 23, 0.58) 0%, rgba(15, 23, 42, 0.34) 28%, transparent 56%),
          radial-gradient(ellipse at 54% 12%, rgba(147, 197, 253, 0.5) 0%, transparent 42%);
        filter: blur(58px);
        opacity: 1;
        transform: translate3d(-3%, -2%, 0) scale(1.04);
      }
      .splash-overlay::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(120deg, rgba(255, 255, 255, 0.56), rgba(255, 255, 255, 0.26)),
          radial-gradient(circle at center, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.44));
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }
      .splash-content {
        position: relative; width: clamp(240px, 68vw, 320px); height: clamp(240px, 68vw, 320px);
        display: flex; align-items: center; justify-content: center;
      }
      .splash-center-logo {
        position: absolute; z-index: 10;
        width: 104px; height: 104px;
        display: flex; align-items: center; justify-content: center;
        background: transparent; border: none; border-radius: 22px;
        box-shadow: none;
        animation: pulse-logo 1.35s infinite ease-in-out;
      }
      .splash-center-logo img { width: 62px; height: auto; object-fit: contain; }
      .splash-orbit {
        --splash-orbit-duration: 11s;
        position: absolute; width: 100%; height: 100%;
        border-radius: 50%;
        animation: orbit-rotate var(--splash-orbit-duration) linear infinite;
      }
      .splash-orbit::before {
        content: ''; position: absolute;
        top: 10%; left: 10%; width: 80%; height: 80%;
        border: 1px dashed rgba(37, 99, 235, 0.3);
        border-radius: 50%; box-sizing: border-box;
        box-shadow: 0 0 40px rgba(37, 99, 235, 0.08);
      }
      .orbit-icon {
        position: absolute; width: 44px; height: 44px;
        background: transparent; border: none; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; color: #2563eb; top: 50%; left: 50%;
        box-shadow: none;
        margin-top: -22px; margin-left: -22px;
      }
      .orbit-icon svg { width: 1em; height: 1em; color: inherit; }

      .splash-loading-label {
        position: absolute;
        bottom: max(40px, env(safe-area-inset-bottom));
        z-index: 1;
        color: #1f2937;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.12em;
        text-shadow: 0 1px 18px rgba(255, 255, 255, 0.9);
        animation: loading-label-pulse 1.2s ease-in-out infinite;
      }

      @keyframes orbit-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      @keyframes icon-spin-1 { from { transform: rotate(0deg) translate(110px) rotate(0deg); } to { transform: rotate(0deg) translate(110px) rotate(-360deg); } }
      @keyframes icon-spin-2 { from { transform: rotate(60deg) translate(110px) rotate(-60deg); } to { transform: rotate(60deg) translate(110px) rotate(-420deg); } }
      @keyframes icon-spin-3 { from { transform: rotate(120deg) translate(110px) rotate(-120deg); } to { transform: rotate(120deg) translate(110px) rotate(-480deg); } }
      @keyframes icon-spin-4 { from { transform: rotate(180deg) translate(110px) rotate(-180deg); } to { transform: rotate(180deg) translate(110px) rotate(-540deg); } }
      @keyframes icon-spin-5 { from { transform: rotate(240deg) translate(110px) rotate(-240deg); } to { transform: rotate(240deg) translate(110px) rotate(-600deg); } }
      @keyframes icon-spin-6 { from { transform: rotate(300deg) translate(110px) rotate(-300deg); } to { transform: rotate(300deg) translate(110px) rotate(-660deg); } }

      @keyframes orbit-icon-tone {
        0%, 100% { color: #2563eb; }
        42% { color: #111827; }
        68% { color: #020617; }
      }

      .orbit-icon:nth-child(1) { animation: icon-spin-1 var(--splash-orbit-duration) linear infinite, orbit-icon-tone var(--splash-orbit-duration) linear infinite; animation-delay: 0s, 0s; }
      .orbit-icon:nth-child(2) { animation: icon-spin-2 var(--splash-orbit-duration) linear infinite, orbit-icon-tone var(--splash-orbit-duration) linear infinite; animation-delay: 0s, -1.83s; }
      .orbit-icon:nth-child(3) { animation: icon-spin-3 var(--splash-orbit-duration) linear infinite, orbit-icon-tone var(--splash-orbit-duration) linear infinite; animation-delay: 0s, -3.66s; }
      .orbit-icon:nth-child(4) { animation: icon-spin-4 var(--splash-orbit-duration) linear infinite, orbit-icon-tone var(--splash-orbit-duration) linear infinite; animation-delay: 0s, -5.5s; }
      .orbit-icon:nth-child(5) { animation: icon-spin-5 var(--splash-orbit-duration) linear infinite, orbit-icon-tone var(--splash-orbit-duration) linear infinite; animation-delay: 0s, -7.33s; }
      .orbit-icon:nth-child(6) { animation: icon-spin-6 var(--splash-orbit-duration) linear infinite, orbit-icon-tone var(--splash-orbit-duration) linear infinite; animation-delay: 0s, -9.16s; }

      @keyframes pulse-logo {
        0% { transform: scale(1); }
        70% { transform: scale(1.045); }
        100% { transform: scale(1); }
      }
      @keyframes loading-label-pulse { 0%, 100% { opacity: 0.68; } 50% { opacity: 1; } }

      /* Dark Mode Support */
      html.theme-dark .splash-overlay, body.theme-dark .splash-overlay { background: #020617; }
      html.theme-dark .splash-overlay::before, body.theme-dark .splash-overlay::before {
        background:
          radial-gradient(circle at 18% 28%, rgba(37, 99, 235, 0.54), transparent 34%),
          radial-gradient(circle at 78% 64%, rgba(0, 0, 0, 0.66), transparent 36%),
          radial-gradient(circle at 58% 16%, rgba(59, 130, 246, 0.34), transparent 30%);
        opacity: 0.9;
      }
      html.theme-dark .splash-overlay::after, body.theme-dark .splash-overlay::after { background: linear-gradient(120deg, rgba(2, 6, 23, 0.58), rgba(2, 6, 23, 0.34)); }
      html.theme-dark .splash-center-logo, body.theme-dark .splash-center-logo,
      html.theme-dark .orbit-icon, body.theme-dark .orbit-icon { background: transparent; border-color: transparent; }
      html.theme-dark .splash-loading-label, body.theme-dark .splash-loading-label { color: #e5e7eb; text-shadow: 0 1px 18px rgba(0, 0, 0, 0.85); }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pre-rendered Splash Screen -->
      <div class="splash-overlay">
        <div class="splash-content">
          <div class="splash-center-logo">
            <img src="/Ryme Icon.png" alt="Ryme Interiors" />
          </div>
          <div class="splash-orbit">
            <!-- Icon 1 -->
            <div class="orbit-icon icon-1">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 5v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2z"></path>
                <path d="M7 7h10"></path><path d="M7 11h10"></path><path d="M7 15h10"></path>
              </svg>
            </div>
            <!-- Icon 2: BarChart2 -->
            <div class="orbit-icon icon-2">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
            </div>
            <!-- Icon 3: ShoppingCart -->
            <div class="orbit-icon icon-3">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
              </svg>
            </div>
            <!-- Icon 4: User -->
            <div class="orbit-icon icon-4">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <!-- Icon 5: Box -->
            <div class="orbit-icon icon-5">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                 <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                 <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                 <line x1="12" y1="22.08" x2="12" y2="12"></line>
              </svg>
            </div>
            <!-- Icon 6: Target -->
            <div class="orbit-icon icon-6">
              <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
              </svg>
            </div>
          </div>
        </div>
        <div class="splash-loading-label">LOADING...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
